<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ミセチョク - デザインモック</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdn.jsdelivr.npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="main-menu">
        <div class="container">
            <h1 class="main-title">ミセチョク</h1>
            <p class="main-subtitle">デザインモックサイト</p>
            
            <div class="menu-buttons">
                <button id="btn-swipe-image" class="btn btn-menu">
                    <i class="fas fa-arrows-alt-v"></i> スワイプイメージ
                </button>
                
                <button id="btn-form-image" class="btn btn-menu">
                    <i class="fas fa-edit"></i> フォームイメージ
                </button>
                
                <a href="https://mearin0424-tech.github.io/personality-test/personality-test.html" class="btn btn-menu" target="_blank" rel="noopener noreferrer">
                    <i class="fas fa-diagnoses"></i> 診断アプリ
                </a>
                
                <button id="btn-notification-screen" class="btn btn-menu">
                    <i class="fas fa-bell"></i> 通知テスト
                </button>
            </div>
        </div>
    </div>

    <div id="form-screen" style="display: none;">
        <button class="btn btn-back-to-menu"><i class="fas fa-arrow-left"></i> メニューに戻る</button>
        <section class="form-section" data-aos="fade-up" data-aos-delay="200">
            <div class="container">
                <h2>ほげほげフォーム</h2>
                <form action="#" method="POST">
                    
                    <div class="form-group">
                        <label for="name">
                            <span class="label-text">ほげほげ（お名前）</span>
                            <span class="required-mark">*</span>
                            <i class="fas fa-question-circle info-icon" data-tooltip="ほげほげ（ヒント）"></i>
                        </label>
                        <input type="text" id="name" name="name" placeholder="例：山田 ほげ子" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">
                            <span class="label-text">ほげほげ（メール）</span>
                            <span class="required-mark">*</span>
                            <i class="fas fa-question-circle info-icon" data-tooltip="ほげほげ（ヒント）"></i>
                        </label>
                        <input type="email" id="email" name="email" placeholder="例：hoge@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="date">
                            <span class="label-text">ほげほげ（日付）</span>
                            <i class="fas fa-question-circle info-icon" data-tooltip="ほげほげ（ヒント）"></i>
                        </label>
                        <input type="date" id="date" name="date">
                    </div>

                    <div class="form-group">
                        <label>
                            <span class="label-text">ほげほげ（種別）</span>
                            <span class="required-mark">*</span>
                            <i class="fas fa-question-circle info-icon" data-tooltip="ほげほげ（ヒント）"></i>
                        </label>
                        <div class="radio-group">
                            <label><input type="radio" name="type" value="A" required> タイプA</label>
                            <label><input type="radio" name="type" value="B"> タイプB</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="message">
                            <span class="label-text">ほげほげ（本文）</span>
                            <span class="required-mark">*</span>
                            <i class="fas fa-question-circle info-icon" data-tooltip="ほげほげ（ヒント）"></i>
                        </label>
                        <textarea id="message" name="message" rows="5" placeholder="ほげほげ..." required></textarea>
                    </div>
                    
                    <div class="form-group text-center">
                        <button type="submit" class="btn btn-primary">ほげ（送信）</button>
                    </div>
                    
                </form>
            </div>
        </section>
    </div>

    <div id="notification-screen" style="display: none;">
        <button class="btn btn-back-to-menu"><i class="fas fa-arrow-left"></i> メニューに戻る</button>
        <section class="notification-section">
            <div class="container">
                <h2>PWA通知テスト</h2>
                <p>PWAとしてインストール後、通知許可をするとテストが可能です。</p>
                <button id="notification-test-btn" class="btn btn-notification">
                    <i class="fas fa-paper-plane"></i> 通知テスト (トークン取得)
                </button>
                <textarea id="token-display-area" style="display: none;" rows="4" readonly></textarea>
                <p id="token-info" style="display: none;">
                    表示されたトークンを開発者に連携してください。<br>アプリを閉じて、通知を待ってね。
                </p>
            </div>
        </section>
    </div>

    <div id="swipe-overlay">
        <button id="close-swipe-btn" title="閉じる">&times;</button>
        <div class="swiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide" style="background-color: #845ec2;">ほげほげ</div>
                <div class="swiper-slide" style="background-color: #d65db1;">ふがふが</div>
                <div class="swiper-slide" style="background-color: #ff6f91;">ぴよぴよ</div>
                <div class="swiper-slide" style="background-color: #ff9671;">さいごのカード</div>
            </div>
        </div>
        <div class="swipe-guide">
            <div class="arrow"></div>
            <div>上へスワイプ</div>
        </div>
    </div>


    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging-compat.js"></script>
    <script src="https://cdn.jsdelivr.npm/swiper@11/swiper-bundle.min.js"></script>
    
    <script src="pwa-loader.js"></script>
    <script src="script.js"></script> 

</body>
</html>
