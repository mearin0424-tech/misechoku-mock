<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <title>ミセチョク - モックアップ (ネイビーxオレンジ)</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>

    <header class="header">
        <div class="container">
            <a href="#" class="logo">ミセチョク</a>
            <nav class="nav">
                <ul>
                    <li><a href="#">ほげほげ</a></li>
                    <li><a href="#">ほげほげ</a></li>
                    <li><a href="#">ほげほげ</a></li>

            </nav>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <h1>ほげほげほげ、ほげほげ。</h1>
                <p>ほげほげほげほげ、ほげほげほげほげほげ。<br>ほげほげほげほげほげほげ。</p>
                <a href="#" class="btn btn-primary">ほげほげほげ</a>
            </div>
        </section>

        <section class="content-section">
            <div class="container">
                <h2>ほげほげほげほげ</h2>
                <div class="two-column">
                    <div class="text-content">
                        <h3>1. ほげほげほげ</h3>
                        <p>ほげほげほげほげほげほげ、ほげほげほげほげほげほげ、ほげほげほげほげ。ほげほげほげほげほげほげほげ。</p>
                        <a href="#" class="btn btn-secondary">ほげほげ</a>
                    </div>
                </div>
            </div>
        </section>
        
        <section class="content-section bg-base">
            <div class="container">
                <h2>ほげほげほげ</h2>
                <div class="two-column">
                    <div class="text-content">
                        <h3>2. ほげほげほげ</h3>

                    </div>
                </div>
            </div>
        </section>

        <section class="form-section">
            <div class="container">
                <h2>ほげほげフォーム</h2>
                <form action="#" method="POST">
                    <div class="form-group">
                        <label for="name">ほげほげ</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">ほげほげ</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">ほげほげ</label>
                        <textarea id="message" name="message" rows="5"></textarea>
                    </div>
                    
                    <div class="form-group" style="text-align: center;">
                        <button type="submit" class="btn btn-primary">ほげ（送信）</button>
                    </div>
                    </form>
            </div>
        </section>

    </main>

    <footer class="footer">
        <div class="container">
