<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NightWork App Design Simulator</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (CDN) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (CDN) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        .pb-safe { padding-bottom: max(16px, env(safe-area-inset-bottom, 16px)); }
        .pt-safe { padding-top: max(8px, env(safe-area-inset-top, 8px)); }
        body { 
            background-color: #000; 
            color: #fff; 
            margin: 0; 
            overflow: hidden;
            height: 100dvh; 
            width: 100vw;
            -webkit-tap-highlight-color: transparent; 
        }
        #root { height: 100%; width: 100%; }

        .font-noto { font-family: 'Noto Sans JP', sans-serif; }
        .font-noto .app-title { font-family: 'Montserrat', 'Noto Sans JP', sans-serif; font-weight: 700; letter-spacing: 0.05em; }

        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // ==========================================

        const accentColors = {

        // ★ ヘッダー＆フッターの色定義
        const hfColorDefs = {

            grad_purple_lilac: { id: 'grad_purple_lilac', name: 'グラデ (ディープパープル × ライラック)', bgClass: 'bg-gradient-to-r from-[#9333EA]/30 to-[#D8B4E2]/30' },

            grad_purple_pink: { id: 'grad_purple_pink', name: 'グラデ (ディープパープル × ピンク)', bgClass: 'bg-gradient-to-r from-[#9333EA]/30 to-[#EC4899]/30' }

        const fontDefs = {

        // Tailwind JIT用セーフリスト
        const TailwindSafelist = () => (
            <div className="hidden border-[#A855F7]/40 bg-[#A855F7] bg-[#A855F7]/10 bg-[#F5F2FA] bg-[#8B5CF6] text-[#A78BFA] from-[#A78BFA] to-[#7C3AED] bg-[#D8B4E2] text-[#D8B4E2] from-[#F3E8F6] to-[#C997D6] bg-[#7DD3FC] text-[#7DD3FC] from-[#BAE6FD] to-[#38BDF8] bg-[#F9A8D4] text-[#F9A8D4] from-[#FBCFE8] to-[#F472B6] text-[#1A1A1A] text-[#666666] text-[#E6DFFC] text-[#F3E8FF] text-[#E0E7FF] text-[#FAF5FF] text-[#EEF2FF] text-[#111] text-white shadow-[inset_0_4px_6px_rgba(255,255,255,0.5),inset_0_-6px_6px_rgba(0,0,0,0.4),0_12px_24px_rgba(0,0,0,0.7)] active:shadow-[inset_0_6px_8px_rgba(0,0,0,0.6),0_2px_4px_rgba(0,0,0,0.6)] shadow-[8px_8px_20px_rgba(0,0,0,0.8),-2px_-2px_8px_rgba(255,255,255,0.03)] shadow-[inset_0_2px_4px_rgba(0,0,0,0.5)] shadow-[inset_0_2px_4px_rgba(0,0,0,0.1)] bg-[#050505] text-[#F5F5F5] text-[#A0A0A0] border-[#2A2A2A] bg-[#050505]/40 from-[#D4AF37] to-[#B8860B] border-[#D4AF37]/30 bg-[#9333EA] from-[#A855F7] to-[#7E22CE] bg-[#581c87] from-[#6b21a8] to-[#3b0764] bg-[#050505]/50 bg-[#9333EA]/30 from-[#050505]/60 to-[#9333EA]/30 from-[#9333EA]/30 to-[#D4AF37]/30 to-[#D8B4E2]/30 to-[#8B5CF6]/30 to-[#EC4899]/30 shadow-[0_4px_12px_rgba(0,0,0,0.6),inset_0_1px_1px_rgba(255,255,255,0.15),inset_0_-1px_1px_rgba(0,0,0,0.5)] shadow-[0_-4px_20px_rgba(0,0,0,0.7),inset_0_1px_1px_rgba(255,255,255,0.15),inset_0_-1px_1px_rgba(0,0,0,0.5)] bg-gradient-to-br from-[#1a1a1a] to-[#050505] shadow-[6px_6px_16px_rgba(0,0,0,0.9),-2px_-2px_6px_rgba(255,255,255,0.06),inset_1px_1px_1px_rgba(255,255,255,0.08)]"></div>

        // ==========================================
        // 🧩 スタイル生成ロジック
        // ==========================================
        const generateStyles = (t, inputStyle, is3D, isGrad, hfColor) => {
            const shadowBtn3D = 'shadow-[inset_0_4px_6px_rgba(255,255,255,0.5),inset_0_-6px_6px_rgba(0,0,0,0.4),0_12px_24px_rgba(0,0,0,0.7)] active:translate-y-1.5 active:shadow-[inset_0_6px_8px_rgba(0,0,0,0.6),0_2px_4px_rgba(0,0,0,0.6)]';
            const shadowBadge3D = 'shadow-[inset_0_2px_3px_rgba(255,255,255,0.4),inset_0_-3px_3px_rgba(0,0,0,0.4),0_6px_12px_rgba(0,0,0,0.5)]';
            const shadowFab3D = 'shadow-[inset_0_4px_6px_rgba(255,255,255,0.5),inset_0_-6px_6px_rgba(0,0,0,0.4),0_14px_28px_rgba(0,0,0,0.7)] active:translate-y-1.5 active:shadow-[inset_0_6px_8px_rgba(0,0,0,0.6),0_2px_4px_rgba(0,0,0,0.6)]';

            // ★ ボタン以外（枠線等）はディープパープルで固定
            const fixedBorderColor = 'border-[#A855F7]/40';
            
            // ★ カードの立体感（背景を少し明るいグラデーションにし、ハイライトと深い影を落とすダーク・ニューモーフィズム）
            const cardBg = is3D ? 'bg-gradient-to-br from-[#1a1a1a] to-[#050505]' : 'bg-transparent';
            const shadowCard3D = is3D ? 'shadow-[6px_6px_16px_rgba(0,0,0,0.9),-2px_-2px_6px_rgba(255,255,255,0.06),inset_1px_1px_1px_rgba(255,255,255,0.08)]' : 'shadow-none';

            // ★ ヘッダー・フッターに「のっぺりしない」立体感（ガラスの厚み・ハイライト）を表現する影を追加
            const headerShadow = 'shadow-[0_4px_12px_rgba(0,0,0,0.6),inset_0_1px_1px_rgba(255,255,255,0.15),inset_0_-1px_1px_rgba(0,0,0,0.5)]';
            const footerShadow = 'shadow-[0_-4px_20px_rgba(0,0,0,0.7),inset_0_1px_1px_rgba(255,255,255,0.15),inset_0_-1px_1px_rgba(0,0,0,0.5)]';

            // ヘッダー・フッターのスタイルを再構築
            const glassHeaderStyle = `${hfColor.bgClass} backdrop-blur-md border-b ${fixedBorderColor} ${headerShadow}`;
            const glassFooterStyle = `${hfColor.bgClass} backdrop-blur-md border-t ${fixedBorderColor} ${footerShadow}`;

            const inputBgClass = inputStyle === 'light' ? 'bg-[#F5F2FA]' : 'bg-[#A855F7]/10';
            const inputBorderClass = inputStyle === 'light' ? 'border-transparent' : `border ${fixedBorderColor}`;
            const inputTextClass = inputStyle === 'light' ? 'text-[#1A1A1A]' : 'text-[#F5F5F5]';
            const inputSubTextClass = inputStyle === 'light' ? 'text-[#666666]' : 'text-[#A0A0A0]';
            const inputPlaceholderClass = inputStyle === 'light' ? 'placeholder-gray-500' : 'placeholder-gray-400';
            const inputShadowClass = inputStyle === 'light' ? 'shadow-[inset_0_2px_4px_rgba(0,0,0,0.1)]' : 'shadow-[inset_0_2px_4px_rgba(0,0,0,0.5)]';

            // ★ ボタンとバッヂの色は深いディープパープルで固定
            const btnBgClass = isGrad ? 'bg-gradient-to-r from-[#6b21a8] to-[#3b0764]' : 'bg-[#581c87]';
            const btnTextClass = isGrad ? 'text-[#FAF5FF]' : 'text-[#F3E8FF]';
            const btnIconClass = 'text-white';

            return {
                button: `px-6 py-3.5 rounded-full ${btnBgClass} ${btnTextClass} ${is3D ? shadowBtn3D : 'shadow-md'} border border-transparent transition-all duration-300 flex items-center justify-center gap-2 font-bold`,
                buttonIcon: btnIconClass,
                badge: `px-4 py-2 rounded-full ${btnBgClass} ${btnTextClass} ${is3D ? shadowBadge3D : ''} font-bold text-sm`,
                miniBadge: `flex items-center justify-center gap-1 ${btnBgClass} ${btnTextClass} text-[9px] font-bold px-1.5 py-0.5 rounded w-full relative -mt-4 z-10 ${is3D ? shadowBadge3D : 'border border-black/20'}`,
                fab: `absolute bottom-[90px] right-5 w-[56px] h-[56px] rounded-full flex items-center justify-center ${btnBgClass} ${btnTextClass} hover:scale-105 transition-all z-30 ${is3D ? shadowFab3D : 'shadow-lg active:scale-95'}`,
                
                textAccent: t.accentText,
                iconAccent: t.accentText,
                fixedBorderColor: fixedBorderColor,
                
                card: `${cardBg} rounded-[20px] overflow-hidden transition-all duration-300 ${shadowCard3D} border ${fixedBorderColor}`,
                menuCard: `${cardBg} p-4 flex items-center justify-between rounded-[16px] transition-all duration-300 group cursor-pointer ${shadowCard3D} border ${fixedBorderColor}`,
                
                specialMenuCard: `rounded-[16px] p-4 flex items-center justify-between transition-all duration-300 group cursor-pointer ${is3D ? `${btnBgClass} ${shadowBtn3D} border border-transparent` : `${cardBg} ${shadowCard3D} border ${fixedBorderColor}`}`,
                specialMenuTitle: `app-title font-bold text-[15px] tracking-widest group-hover:opacity-80 transition-opacity ${is3D ? btnTextClass : t.accentText}`,
                specialMenuSub: `text-[9px] font-bold tracking-[0.1em] mb-1 uppercase ${is3D ? btnTextClass + ' opacity-70' : t.textSub}`,
                specialMenuIconWrapper: `w-11 h-11 rounded-xl flex items-center justify-center transition-all ${is3D ? 'bg-black/20 shadow-inner border border-white/10' : 'bg-transparent border ' + fixedBorderColor + ' shadow-[inset_0_2px_4px_rgba(0,0,0,0.6)]'}`,
                specialMenuIcon: `text-[18px] ${is3D ? btnIconClass : t.accentText}`,
                specialMenuArrow: `w-8 h-8 rounded-full border flex items-center justify-center transition-colors ${is3D ? 'border-white/30 group-hover:border-white/70' : 'border-white/20 group-hover:border-white/50'}`,
                specialMenuArrowIcon: `text-[16px] transition-colors ${is3D ? btnIconClass + ' opacity-70 group-hover:opacity-100' : 'text-white/50 group-hover:text-white'}`,

                inputContainer: `${inputBgClass} ${inputBorderClass} ${inputShadowClass} transition-all duration-300`,
                inputText: inputTextClass,
                inputSubText: inputSubTextClass,
                inputPlaceholder: inputPlaceholderClass,

                glassHeader: glassHeaderStyle,
                glassFooter: glassFooterStyle,
                tabLine: `absolute bottom-0 left-1/2 -translate-x-1/2 w-12 h-1 rounded-t-full bg-[#A855F7]`,
                
                myMessageBubble: `px-4 py-2.5 rounded-[20px] rounded-tr-sm ${btnBgClass} ${btnTextClass} ${is3D ? shadowBadge3D : 'shadow-md'} font-medium text-[13px] leading-relaxed border border-transparent w-fit`,
                otherMessageBubble: `px-4 py-2.5 rounded-[20px] rounded-tl-sm ${cardBg} border ${fixedBorderColor} ${shadowCard3D} ${t.textMain} font-medium text-[13px] leading-relaxed w-fit`,
                systemMessageBubble: `px-4 py-2.5 rounded-[20px] ${cardBg} border ${fixedBorderColor} ${shadowCard3D} ${t.textMain} font-medium text-[13px] leading-relaxed w-fit`
            }
        };

        // ==========================================
        // 📱 共通コンポーネント: 下部ナビゲーション
        // ==========================================
        const BottomNav = ({ theme, styles, activeTab, onChangeTab }) => {
            const navItems = [
                { id: 'swipe', icon: 'ph-cards-fill', label: 'SWIPE' },
                { id: 'search', icon: 'ph-magnifying-glass-bold', label: 'SEARCH' },
                { id: 'likes', icon: 'ph-users-fill', label: 'LIKES' },
                { id: 'talk', icon: 'ph-chat-teardrop-text-fill', label: 'TALK' },
                { id: 'mypage', icon: 'ph-user-fill', label: 'MY PAGE' },
            ];

            return (
                <nav className={`absolute bottom-0 left-0 w-full ${styles.glassFooter} z-50 pb-safe transition-colors duration-300`}>
                    <div className="flex justify-around items-center pt-3 pb-2 px-2 max-w-[430px] mx-auto">
                        {navItems.map(item => {
                            const isActive = activeTab === item.id || (item.id === 'talk' && activeTab === 'talk_room');
                            return (
                                <button 
                                    key={item.id} 
                                    onClick={() => onChangeTab(item.id)}
                                    className={`flex flex-col items-center p-2 transition-all duration-300 group cursor-pointer`}
                                >
                                    <i className={`${item.icon} text-[22px] mb-1.5 transition-transform ${isActive ? 'scale-110 ' + styles.iconAccent : `group-hover:scale-95 ${theme.textSub} group-hover:text-white`}`}></i>
                                    <span className={`app-title text-[9px] font-bold tracking-widest ${isActive ? styles.textAccent : `${theme.textSub} group-hover:text-white`}`}>{item.label}</span>
                                </button>
                            );
                        })}
                    </div>
                </nav>
            );
        };

        // ==========================================
        // 📱 画面1: ホーム / スワイプ画面
        // ==========================================
        const HomeSwipeScreen = ({ theme, styles, is3D, isGrad, swipeActionStyle }) => {
            const initialCards = [
                {
                    id: '1',
                    name: 'Club Luminous',
                    copy: 'エリア最高峰の高級ラウンジ',
                    rating: '4.8',
                    reviews: '24',
                    location: '東京都 港区',
                    bonus: '¥100,000',
                    hourlyWage: '¥8,000〜',
                    helpWage: '¥4,000',
                    imageUrls: [
                        'https://images.unsplash.com/photo-1585553616435-2dc0a54e271d?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80',
                        'https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80',
                        'https://images.unsplash.com/photo-1575037614876-c385bbd826ea?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80'
                    ]
                },
                {
                    id: '2',
                    name: 'Snack 昭和',
                    copy: 'アットホームな老舗スナック',
                    rating: '4.2',
                    reviews: '8',
                    location: '東京都 葛飾区',
                    bonus: '¥10,000',
                    hourlyWage: '¥2,000〜',
                    helpWage: 'ー',
                    imageUrls: [
                        'https://images.unsplash.com/photo-1514933651103-005eec06c04b?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80',
                        'https://images.unsplash.com/photo-1525268771113-32d9e9021a97?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80'
                    ]
                },
                {
                    id: '3',
                    name: 'CUTE',
                    copy: '未経験から高収入を目指せる！',
                    rating: '4.5',
                    reviews: '12',
                    location: '東京都 江戸川区',
                    bonus: '¥50,000',
                    hourlyWage: '¥3,500〜',
                    helpWage: 'ー',
                    imageUrls: [
                        'https://images.unsplash.com/photo-1513360371669-4adf3dd7dff8?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80',
                        'https://images.unsplash.com/photo-1557672172-298e090bd0f1?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80',
                        'https://images.unsplash.com/photo-1534528741775-53994a69daeb?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80'
                    ]
                }
            ];

            const [cards, setCards] = useState(initialCards.map(c => ({...c, currentImageIndex: 0})));
            const [dragStart, setDragStart] = useState({ x: 0, y: 0 });
            const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });
            const [isDragging, setIsDragging] = useState(false);

            const handleDragStart = (e) => {
                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                setDragStart({ x: clientX, y: clientY });
                setIsDragging(true);
            };

            const handleDragMove = (e) => {
                if (!isDragging) return;
                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                setDragOffset({ x: clientX - dragStart.x, y: clientY - dragStart.y });
            };

            const handleDragEnd = (e) => {
                if (!isDragging) return;
                setIsDragging(false);
                
                const absX = Math.abs(dragOffset.x);
                const absY = Math.abs(dragOffset.y);
                const threshold = 60;

                if (absY > absX && absY > threshold) {
                    if (dragOffset.y < -threshold) {
                        handleSwipeCard('up');
                    } else if (dragOffset.y > threshold) {
                        handleSwipeCard('down');
                    } else {
                        setDragOffset({ x: 0, y: 0 });
                    }
                } else if (absX > absY && absX > threshold) {
                    if (dragOffset.x < -threshold) {
                        handleSwipeImage('next');
                    } else if (dragOffset.x > threshold) {
                        handleSwipeImage('prev');
                    } else {
                        setDragOffset({ x: 0, y: 0 });
                    }
                } else {
                    setDragOffset({ x: 0, y: 0 });
                }
            };

            const handleClick = (e) => {
                if (Math.abs(dragOffset.x) > 10 || Math.abs(dragOffset.y) > 10) return;
                
                const rect = e.currentTarget.getBoundingClientRect();
                const clientX = e.type.includes('mouse') ? e.clientX : (e.changedTouches ? e.changedTouches[0].clientX : 0);
                const x = clientX - rect.left;
                
                if (x > rect.width / 2) {
                    handleSwipeImage('next');
                } else {
                    handleSwipeImage('prev');
                }
            };

            const handleSwipeCard = (direction) => {
                setDragOffset({
                    x: 0,
                    y: direction === 'up' ? -window.innerHeight : window.innerHeight
                });
                
                setTimeout(() => {
                    setCards(prev => {
                        const newCards = [...prev];
                        if (direction === 'up') {
                            const first = newCards.shift();
                            newCards.push({...first, currentImageIndex: 0});
                        } else {
                            const last = newCards.pop();
                            newCards.unshift({...last, currentImageIndex: 0});
                        }
                        return newCards;
                    });

        // ==========================================

            const chatData = [

                { type: 'received', time: '01:28', text: 'この度は面談ありがとうございました。採用で進めさせていただきたいと考えております。詳細は追ってご連絡いたします。', iconUrl: 'https://images.unsplash.com/photo-1585553616435-2dc0a54e271d?ixlib=rb-1.2.1&auto=format&fit=crop&w=100&q=80' },

                                <button onClick={onBack} className={`${styles.iconAccent} hover:opacity-80 shrink-0`}><i className="ph-bold ph-caret-left text-[20px]"></i></button>
                                <div className={`w-8 h-8 rounded-full border ${styles.fixedBorderColor} overflow-hidden shrink-0 shadow-sm`}>

                                return (
                                    <div key={i} className="flex gap-3 mt-4">
                                        <div className={`w-9 h-9 rounded-full border ${styles.fixedBorderColor} flex items-center justify-center bg-[#1A1A1A] shrink-0 shadow-sm`}>

                                        </div>
                                        <div className="flex flex-col items-start max-w-[80%] gap-2.5">

                                                </button>
                                            )}
                                        </div>
                                    </div>

                            }
                            if (msg.type === 'received') {
                                return (
                                    <div key={i} className="flex gap-3">
                                        <div className={`w-9 h-9 rounded-full border ${styles.fixedBorderColor} overflow-hidden shrink-0 shadow-sm`}>
                                            <img src={msg.iconUrl} alt="icon" className="w-full h-full object-cover" />

                                        <div className="flex items-end gap-2 max-w-[80%]">

                            </div>

                            <div className="w-full relative border-t border-white/10 pt-6">

                                    <label className="flex items-center gap-3 cursor-pointer">

                                    </label>
                                    <label className="flex items-center gap-3 cursor-pointer">
                                        <input type="radio" name="inputStyle" value="light" checked={inputStyle === 'light'} onChange={() => setInputStyle('light')} className="hidden" />
                                        <div className={`w-5 h-5 rounded-full border flex items-center justify-center transition-colors ${inputStyle === 'light' ? 'border-white' : 'border-gray-500'}`}>
                                            {inputStyle === 'light' && <div className="w-2.5 h-2.5 rounded-full bg-white"></div>}

                                        <span className={`text-sm font-bold ${inputStyle === 'light' ? 'text-white' : 'text-[#A0A0A0]'}`}>ライト (明るい薄紫)</span>

                                        <span className={`text-sm font-bold ${swipeActionStyle === 'buttons' ? 'text-white' : 'text-[#A0A0A0]'}`}>ボタン (× / ♡)</span>
                                    </label>
                                    <label className="flex items-center gap-3 cursor-pointer">
                                        <input type="radio" name="swipeActionStyle" value="swipe_only" checked={swipeActionStyle === 'swipe_only'} onChange={() => setSwipeActionStyle('swipe_only')} className="hidden" />

                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* 📱 アプリ画面エリア */}
                    <div className={`flex-1 flex flex-col w-full max-w-[430px] mx-auto bg-[#050505] shadow-[0_0_50px_rgba(0,0,0,0.8)] relative overflow-hidden h-full`}>

                            <TalkRoomScreen theme={theme} styles={styles} is3D={is3D} isGrad={isGrad} onBack={() => setCurrentAppTab('talk')} />
                        )}
                        {currentAppTab === 'mypage' && (
                            <MyPageScreen theme={theme} styles={styles} />

                        {!['swipe', 'search', 'talk', 'talk_room', 'mypage'].includes(currentAppTab) && (
                            <div className={`relative w-full h-full ${theme.bgMain} flex flex-col transition-colors duration-300`}>
