                                                </div>
                                            </div>
                                        </div>
                                        <div className={`flex justify-end items-center mt-3 pt-3 border-t ${theme.border}`}>
                                            <span className={`flex items-center text-[10px] ${theme.textSub} font-medium`}><i className="ph-bold ph-clock text-[11px] mr-1"></i>{item.time}</span>
                                        </div>
                                    </div>
                                ))}
                                <div className={`py-8 text-center ${theme.textSub} text-xs font-medium flex items-center justify-center gap-3`}>
                                    <div className={`w-10 h-px ${theme.border}`}></div>
                                    これ以上結果はありません
                                    <div className={`w-10 h-px ${theme.border}`}></div>
                                </div>
                            </div>
                        </div>

                        <button className={`absolute bottom-[90px] right-5 w-[56px] h-[56px] rounded-full flex items-center justify-center transition-all duration-300 hover:scale-105 active:scale-95 z-30 ${styleData.btnPrimary}`}>
                            <i className="ph-bold ph-faders text-[24px]"></i>
                        </button>
                    </div>

                    <BottomNav theme={theme} styleData={styleData} activeTab="search" />
                </div>
            );
        };

        // ==========================================
        // 🚀 アプリケーション全体
        // ==========================================
        const App = () => {
            const [currentThemeId, setCurrentThemeId] = useState('wine_gold'); 
            const [currentMode, setCurrentMode] = useState('dark');
            const [currentStyle, setCurrentStyle] = useState('3d');

            const theme = themes[currentThemeId][currentMode];
            const styleData = theme.styles[currentStyle];

            return (
                <div className={`min-h-[100dvh] w-full flex flex-col ${theme.bgApp} transition-colors duration-500 font-sans`}>
                    
                    {/* 🛠️ シミュレーター ツールバー (固定/スクロール追従) */}
                    <div className="fixed top-0 left-0 w-full bg-black/80 backdrop-blur-xl border-b border-white/10 p-2 z-[60] shadow-xl">
                        <div className="max-w-4xl mx-auto w-full flex gap-2 items-end overflow-x-auto pb-1 no-scrollbar px-2">
                            <div className="flex-1 min-w-[130px] relative">
                                <label className="block text-[9px] text-gray-400 font-bold tracking-wider mb-1 ml-1">COLOR THEME</label>
                                <select 
                                    className="w-full bg-white/10 text-white border border-white/20 rounded-md pl-2 pr-6 py-1.5 text-xs outline-none appearance-none focus:border-white/50 cursor-pointer font-bold"
                                    value={currentThemeId}
                                    onChange={(e) => setCurrentThemeId(e.target.value)}
                                >
                                    {Object.values(themes).map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                </select>
                                <i className="ph-bold ph-caret-down absolute right-2 bottom-[8px] text-gray-400 pointer-events-none text-xs"></i>
                            </div>

                            <div className="w-[100px] shrink-0 relative">
                                <label className="block text-[9px] text-gray-400 font-bold tracking-wider mb-1 ml-1">MODE</label>
                                <select 
                                    className="w-full bg-white/10 text-[#FFD700] border border-[#FFD700]/50 rounded-md pl-2 pr-6 py-1.5 text-xs outline-none appearance-none focus:border-[#FFD700] cursor-pointer font-bold"
                                    value={currentMode}
                                    onChange={(e) => setCurrentMode(e.target.value)}
                                >
                                    <option value="dark">🌙 DARK</option>
                                    <option value="light">☀️ LIGHT</option>
                                </select>
                                <i className="ph-bold ph-caret-down absolute right-2 bottom-[8px] text-[#FFD700] pointer-events-none text-xs"></i>
                            </div>

                            <div className="flex-1 min-w-[130px] relative">
                                <label className="block text-[9px] text-gray-400 font-bold tracking-wider mb-1 ml-1">UI STYLE (質感)</label>
                                <select 
                                    className="w-full bg-white/10 text-white border border-white/20 rounded-md pl-2 pr-6 py-1.5 text-xs outline-none appearance-none focus:border-white/50 cursor-pointer font-bold"
                                    value={currentStyle}
                                    onChange={(e) => setCurrentStyle(e.target.value)}
                                >
                                    <option value="gradient">グラデ (Standard)</option>
                                    <option value="flat">のっぺり (Flat)</option>
                                    <option value="3d">立体 (Neumorphism)</option>
                                    <option value="neon">ネオン (Glow)</option>
                                </select>
                                <i className="ph-bold ph-caret-down absolute right-2 bottom-[8px] text-gray-400 pointer-events-none text-xs"></i>
                            </div>
                        </div>
                    </div>

                    {/* 📱 アプリ画面エリア (フルスクリーン、枠なし、縦スクロール) */}
                    <div className="flex-1 flex flex-col w-full pt-[64px]">
                        
                        {/* HOME / SWIPE 画面 */}
                        <div className="w-full h-[100dvh] relative border-b-8 border-black/40">
                            <HomeSwipeScreen theme={theme} styleData={styleData} />
                        </div>

                        {/* SEARCH / TIMELINE 画面 */}
                        <div className="w-full min-h-[100dvh] relative">
                            <SearchTimelineScreen theme={theme} styleData={styleData} />
                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
