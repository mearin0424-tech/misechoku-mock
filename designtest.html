<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NightWork App Simulator</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Montserrat:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        .pb-safe { padding-bottom: max(16px, env(safe-area-inset-bottom, 16px)); }
        .pt-safe { padding-top: max(8px, env(safe-area-inset-top, 8px)); }
        body { 
            background-color: #000; 
            color: #fff; 
            margin: 0; 
            overflow: hidden;
            height: 100dvh; 
            width: 100vw;
            -webkit-tap-highlight-color: transparent; 
        }
        #root { height: 100%; width: 100%; }

        .font-zen { font-family: 'Zen Maru Gothic', sans-serif; }
        .font-zen .app-title { font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; letter-spacing: 0.05em; }

        .font-mplus { font-family: 'M PLUS Rounded 1c', sans-serif; }
        .font-mplus .app-title { font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 800; letter-spacing: 0.05em; }

        .font-noto { font-family: 'Noto Sans JP', sans-serif; }
        .font-noto .app-title { font-family: 'Montserrat', 'Noto Sans JP', sans-serif; font-weight: 700; letter-spacing: 0.05em; }

        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // ==========================================
        // 🎨 テーマ定義
        // ==========================================
        const bgThemes = {
            black: { 
                id: 'black', name: 'ブラック (堅牢・透明性)', 
                bgApp: 'bg-[#050505]', bgMain: 'bg-[#050505]', textMain: 'text-[#F5F5F5]', textSub: 'text-[#A0A0A0]', 
                borderColor: 'border-[#2A2A2A]', glassBg: 'bg-[#050505]/65', bgMainHex: '#050505'
            }
        };

        const accentColors = {
            mauve_lavender: {
                id: 'mauve_lavender', name: 'モーブ (薄ピンクに近い紫)',
                accentBg: 'bg-[#CBA6D9]', accentText: 'text-[#CBA6D9]', accentBorderLight: 'border-[#CBA6D9]/40', 
                inputBg: 'bg-[#CBA6D9]/10', inputBgLight: 'bg-[#F5F0F7]' // ほんのり紫がかった白
            },
            pale_lilac: {
                id: 'pale_lilac', name: 'ライラック (淡く優しい紫)',
                accentBg: 'bg-[#D8B4E2]', accentText: 'text-[#D8B4E2]', accentBorderLight: 'border-[#D8B4E2]/40', 
                inputBg: 'bg-[#D8B4E2]/10', inputBgLight: 'bg-[#F8F5F9]'
            },
            royal_amethyst: {
                id: 'royal_amethyst', name: 'アメジスト (王道で高貴な紫)',
                accentBg: 'bg-[#8B5CF6]', accentText: 'text-[#A78BFA]', accentBorderLight: 'border-[#A78BFA]/40', 
                inputBg: 'bg-[#A78BFA]/10', inputBgLight: 'bg-[#F4F2FA]'
            },
            deep_purple: {
                id: 'deep_purple', name: 'ディープ・パープル (濃い紫)',
                accentBg: 'bg-[#9333EA]', accentText: 'text-[#A855F7]', accentBorderLight: 'border-[#A855F7]/40', 
                inputBg: 'bg-[#A855F7]/10', inputBgLight: 'bg-[#F5F2FA]'
            },
            blue_purple: {
                id: 'blue_purple', name: 'ブルー・パープル (青みのある紫)',
                accentBg: 'bg-[#6366F1]', accentText: 'text-[#818CF8]', accentBorderLight: 'border-[#818CF8]/40', 
                inputBg: 'bg-[#818CF8]/10', inputBgLight: 'bg-[#F3F4FB]'
            }
        };

        const fontDefs = {
            zen_maru: { id: 'zen_maru', name: 'Zen Maru (親しみ・ポップ)', family: 'font-zen' },
            m_plus: { id: 'm_plus', name: 'M PLUS Rounded (モダン・すっきり)', family: 'font-mplus' },
            noto_sans: { id: 'noto_sans', name: 'Noto Sans (王道・高視認性)', family: 'font-noto' },
        };

        const TailwindSafelist = () => (
            <div className="hidden bg-[#CBA6D9] text-[#CBA6D9] border-[#CBA6D9]/40 bg-[#CBA6D9]/10 bg-[#F5F0F7] bg-[#D8B4E2] text-[#D8B4E2] border-[#D8B4E2]/40 bg-[#D8B4E2]/10 bg-[#F8F5F9] bg-[#8B5CF6] text-[#A78BFA] border-[#A78BFA]/40 bg-[#A78BFA]/10 bg-[#F4F2FA] bg-[#9333EA] text-[#A855F7] border-[#A855F7]/40 bg-[#A855F7]/10 bg-[#F5F2FA] bg-[#6366F1] text-[#818CF8] border-[#818CF8]/40 bg-[#818CF8]/10 bg-[#F3F4FB] text-[#1A1A1A] text-[#666666] shadow-[inset_0_2px_4px_rgba(255,255,255,0.4),inset_0_-4px_4px_rgba(0,0,0,0.3),0_6px_12px_rgba(0,0,0,0.8)] shadow-[inset_0_1px_2px_rgba(255,255,255,0.4),inset_0_-2px_2px_rgba(0,0,0,0.3),0_4px_8px_rgba(0,0,0,0.6)] shadow-[8px_8px_20px_rgba(0,0,0,0.8),-2px_-2px_8px_rgba(255,255,255,0.03)] shadow-[inset_0_2px_4px_rgba(0,0,0,0.5)] shadow-[inset_0_2px_4px_rgba(0,0,0,0.1)] bg-[#050505] text-[#F5F5F5] text-[#A0A0A0] border-[#2A2A2A] bg-[#050505]/65"></div>
        );

        // ==========================================
        // 🧩 スタイル生成ロジック
        // ==========================================
        const generateStyles = (t, isGlass, inputStyle) => {
            const shadowBtn3D = 'shadow-[inset_0_2px_4px_rgba(255,255,255,0.4),inset_0_-4px_4px_rgba(0,0,0,0.3),0_6px_12px_rgba(0,0,0,0.8)] active:translate-y-1 active:shadow-[inset_0_4px_6px_rgba(0,0,0,0.5),0_2px_4px_rgba(0,0,0,0.8)]';
            const shadowBadge3D = 'shadow-[inset_0_1px_2px_rgba(255,255,255,0.4),inset_0_-2px_2px_rgba(0,0,0,0.3),0_4px_8px_rgba(0,0,0,0.6)]';
            const shadowCard3D = 'shadow-[8px_8px_20px_rgba(0,0,0,0.8),-2px_-2px_8px_rgba(255,255,255,0.03)]';
            const shadowFab3D = 'shadow-[inset_0_2px_4px_rgba(255,255,255,0.4),inset_0_-4px_4px_rgba(0,0,0,0.3),0_8px_16px_rgba(0,0,0,0.8)] active:translate-y-1 active:shadow-[inset_0_4px_6px_rgba(0,0,0,0.5),0_2px_4px_rgba(0,0,0,0.8)]';

            const cardBg = 'bg-transparent';
            const glassHeaderStyle = isGlass ? `${t.glassBg} backdrop-blur-xl border-b ${t.accentBorderLight} shadow-lg` : `${t.bgMain} border-b ${t.accentBorderLight} shadow-lg`;
            const glassFooterStyle = isGlass ? `${t.glassBg} backdrop-blur-xl border-t ${t.accentBorderLight} shadow-[0_-4px_20px_rgba(0,0,0,0.5)]` : `${t.bgMain} border-t ${t.accentBorderLight} shadow-[0_-4px_20px_rgba(0,0,0,0.5)]`;

            // ★ 入力欄（ライト/ダーク）のスタイル制御
            const inputBgClass = inputStyle === 'light' ? t.inputBgLight : t.inputBg;
            const inputBorderClass = inputStyle === 'light' ? 'border-transparent' : `border ${t.accentBorderLight}`;
            const inputTextClass = inputStyle === 'light' ? 'text-[#1A1A1A]' : 'text-[#F5F5F5]';
            const inputSubTextClass = inputStyle === 'light' ? 'text-[#666666]' : 'text-[#A0A0A0]';
            const inputPlaceholderClass = inputStyle === 'light' ? 'placeholder-gray-500' : 'placeholder-gray-400';
            const inputShadowClass = inputStyle === 'light' ? 'shadow-[inset_0_2px_4px_rgba(0,0,0,0.1)]' : 'shadow-[inset_0_2px_4px_rgba(0,0,0,0.5)]';

            return {
                button: `px-6 py-3.5 rounded-full text-[#111] transition-all duration-300 flex items-center justify-center gap-2 font-bold ${t.accentBg} ${shadowBtn3D} border border-transparent`,
                badge: `px-4 py-2 rounded-full text-[#111] font-bold text-sm ${t.accentBg} ${shadowBadge3D}`,
                miniBadge: `flex items-center justify-center gap-1 text-[#111] text-[9px] font-bold px-1.5 py-0.5 rounded w-full relative -mt-4 z-10 ${t.accentBg} ${shadowBadge3D} border border-transparent`,
                fab: `absolute bottom-[90px] right-5 w-[56px] h-[56px] rounded-full flex items-center justify-center text-[#111] hover:scale-105 transition-all z-30 ${t.accentBg} ${shadowFab3D}`,
                
                textAccent: t.accentText,
                iconAccent: t.accentText,
                
                card: `${cardBg} rounded-[20px] overflow-hidden transition-all duration-300 ${shadowCard3D} border ${t.accentBorderLight}`,
                menuCard: `${cardBg} p-4 flex items-center justify-between rounded-[16px] transition-all duration-300 group cursor-pointer ${shadowCard3D} border ${t.accentBorderLight}`,
                
                // 入力系のスタイル
                inputContainer: `${inputBgClass} ${inputBorderClass} ${inputShadowClass} transition-all duration-300`,
                inputText: inputTextClass,
                inputSubText: inputSubTextClass,
                inputPlaceholder: inputPlaceholderClass,

                glassHeader: glassHeaderStyle,
                glassFooter: glassFooterStyle,
                tabLine: `absolute bottom-0 left-1/2 -translate-x-1/2 w-12 h-1 rounded-t-full ${t.accentBg}`
            }
        };

        // ==========================================
        // 📱 共通コンポーネント: 下部ナビゲーション
        // ==========================================
        const BottomNav = ({ theme, styles, activeTab, onChangeTab }) => {
            const navItems = [
                { id: 'swipe', icon: 'ph-cards-fill', label: 'SWIPE' },
                { id: 'search', icon: 'ph-magnifying-glass-bold', label: 'SEARCH' },
                { id: 'likes', icon: 'ph-users-fill', label: 'LIKES' },
                { id: 'talk', icon: 'ph-chat-teardrop-text-fill', label: 'TALK' },
                { id: 'mypage', icon: 'ph-user-fill', label: 'MY PAGE' },
            ];

            return (
                <nav className={`absolute bottom-0 left-0 w-full ${styles.glassFooter} z-50 pb-safe transition-colors duration-300`}>
                    <div className="flex justify-around items-center pt-3 pb-2 px-2 max-w-[430px] mx-auto">
                        {navItems.map(item => {
                            const isActive = activeTab === item.id;
                            return (
                                <button 
                                    key={item.id} 
                                    onClick={() => onChangeTab(item.id)}
                                    className={`flex flex-col items-center p-2 transition-all duration-300 group cursor-pointer`}
                                >
                                    <i className={`${item.icon} text-[22px] mb-1.5 transition-transform ${isActive ? 'scale-110 ' + styles.iconAccent : `group-hover:scale-95 ${theme.textSub} group-hover:text-white`}`}></i>
                                    <span className={`app-title text-[9px] font-bold tracking-widest ${isActive ? styles.textAccent : `${theme.textSub} group-hover:text-white`}`}>{item.label}</span>
                                </button>
                            );
                        })}
                    </div>
                </nav>
            );
        };

        // ==========================================
        // 📱 画面1: ホーム / スワイプ画面
        // ==========================================
        const HomeSwipeScreen = ({ theme, styles }) => {
            const initialCards = [
                {
                    id: '1',
                    name: 'Club Luminous',
                    copy: 'エリア最高峰の高級ラウンジ',
                    rating: '4.8',
                    reviews: '24',
                    location: '東京都 港区',
                    bonus: '¥100,000',
                    hourlyWage: '¥8,000〜',
                    helpWage: '¥4,000',
                    imageUrls: [
                        'https://images.unsplash.com/photo-1585553616435-2dc0a54e271d?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80',
                        'https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80',
                        'https://images.unsplash.com/photo-1575037614876-c385bbd826ea?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80'
                    ]
                },
                {
                    id: '2',
                    name: 'Snack 昭和',
                    copy: 'アットホームな老舗スナック',
                    rating: '4.2',
                    reviews: '8',
                    location: '東京都 葛飾区',
                    bonus: '¥10,000',
                    hourlyWage: '¥2,000〜',
                    helpWage: 'ー',
                    imageUrls: [
                        'https://images.unsplash.com/photo-1514933651103-005eec06c04b?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80',
                        'https://images.unsplash.com/photo-1525268771113-32d9e9021a97?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80'
                    ]
                },
                {
                    id: '3',
                    name: 'CUTE',
                    copy: '未経験から高収入を目指せる！',
                    rating: '4.5',
                    reviews: '12',
                    location: '東京都 江戸川区',
                    bonus: '¥50,000',
                    hourlyWage: '¥3,500〜',
                    helpWage: 'ー',
                    imageUrls: [
                        'https://images.unsplash.com/photo-1513360371669-4adf3dd7dff8?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80',
                        'https://images.unsplash.com/photo-1557672172-298e090bd0f1?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80',
                        'https://images.unsplash.com/photo-1534528741775-53994a69daeb?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80'
                    ]
                },
                {
                    id: '4',
                    name: 'PUB 淀み',
                    copy: '地元で愛される大衆キャバクラ',
                    rating: '3.9',
                    reviews: '5',
                    location: '東京都 北区',
                    bonus: '¥30,000',
                    hourlyWage: '¥2,500〜',
                    helpWage: 'ー',
                    imageUrls: [
                        'https://images.unsplash.com/photo-1566737236500-c8ac43014a67?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80',
                        'https://images.unsplash.com/photo-1574096079513-d8259312b78a?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80'
                    ]
                }
            ];

            const [cards, setCards] = useState(initialCards.map(c => ({...c, currentImageIndex: 0})));
            const [dragStart, setDragStart] = useState({ x: 0, y: 0 });
            const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });
            const [isDragging, setIsDragging] = useState(false);

            const handleDragStart = (e) => {
                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                setDragStart({ x: clientX, y: clientY });
                setIsDragging(true);
            };

            const handleDragMove = (e) => {
                if (!isDragging) return;
                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                setDragOffset({ x: clientX - dragStart.x, y: clientY - dragStart.y });
            };

            const handleDragEnd = (e) => {
                if (!isDragging) return;
                setIsDragging(false);
                
                const absX = Math.abs(dragOffset.x);
                const absY = Math.abs(dragOffset.y);
                const threshold = 60;

                if (absY > absX && absY > threshold) {
                    if (dragOffset.y < -threshold) {
                        handleSwipeCard('up');
                    } else if (dragOffset.y > threshold) {
                        handleSwipeCard('down');
                    } else {
                        setDragOffset({ x: 0, y: 0 });
                    }
                } else if (absX > absY && absX > threshold) {
                    if (dragOffset.x < -threshold) {
                        handleSwipeImage('next');
                    } else if (dragOffset.x > threshold) {
                        handleSwipeImage('prev');
                    } else {
                        setDragOffset({ x: 0, y: 0 });
                    }
                } else {
                    setDragOffset({ x: 0, y: 0 });
                }
            };

            const handleClick = (e) => {
                if (Math.abs(dragOffset.x) > 10 || Math.abs(dragOffset.y) > 10) return;
                
                const rect = e.currentTarget.getBoundingClientRect();
                const clientX = e.type.includes('mouse') ? e.clientX : (e.changedTouches ? e.changedTouches[0].clientX : 0);
                const x = clientX - rect.left;
                
                if (x > rect.width / 2) {
                    handleSwipeImage('next');
                } else {
                    handleSwipeImage('prev');
                }
            };

            const handleSwipeCard = (direction) => {
                setDragOffset({
                    x: 0,
                    y: direction === 'up' ? -window.innerHeight : window.innerHeight
                });
                
                setTimeout(() => {
                    setCards(prev => {
                        const newCards = [...prev];
                        if (direction === 'up') {
                            const first = newCards.shift();
                            newCards.push({...first, currentImageIndex: 0});
                        } else {
                            const last = newCards.pop();
                            newCards.unshift({...last, currentImageIndex: 0});
                        }
                        return newCards;
                    });
                    setDragOffset({ x: 0, y: 0 });
                }, 300);
            };

            const handleSwipeImage = (direction) => {
                setCards(prev => {
                    const newCards = [...prev];
                    const topCard = newCards[0];
                    const maxIndex = topCard.imageUrls.length - 1;
                    
                    if (direction === 'next' && topCard.currentImageIndex < maxIndex) {
                        topCard.currentImageIndex += 1;
                    } else if (direction === 'prev' && topCard.currentImageIndex > 0) {
                        topCard.currentImageIndex -= 1;
                    }
                    return newCards;
                });
                setDragOffset({ x: 0, y: 0 });
            };

// ★ ボーナス金バッジ専用スタイル (濃いゴールド固定)
            const bonusBadgeStyle = `inline-flex items-center gap-4 mb-3 transform hover:scale-105 transition-all self-start px-4 py-2.5 rounded-full text-[#111] font-bold cursor-pointer bg-gradient-to-r from-[#D4AF37] to-[#B8860B] shadow-[inset_0_2px_4px_rgba(255,255,255,0.4),inset_0_-4px_4px_rgba(0,0,0,0.3),0_6px_12px_rgba(0,0,0,0.8)] border border-[#D4AF37]/30`;
            const bgHex = theme.bgMainHex;
            const gradientStyle = {
                background: `linear-gradient(to top, ${bgHex} 15%, ${bgHex} 45%, transparent 100%)`
            };

            return (
                <div className={`relative w-full h-full flex flex-col overflow-hidden transition-colors duration-300 ${theme.bgMain}`}>
                    
                    <header className={`absolute top-0 left-0 w-full z-40 flex items-center justify-between px-5 py-4 ${styles.glassHeader} pt-safe pointer-events-none transition-colors duration-300`}>
                        <div className="w-12"></div>
                        <h1 className={`${theme.textMain} app-title text-[16px] font-bold text-center absolute left-1/2 -translate-x-1/2`}>DISCOVERY</h1>
                        <div className={`flex items-center gap-4 ${styles.iconAccent} pointer-events-auto`}>
                            <div className="relative cursor-pointer">
                                <i className="ph-bold ph-bell text-[20px]"></i>
                                <span className={`absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full border-2 ${theme.borderColor} ${theme.accentBg}`}></span>
                            </div>
                        </div>
                    </header>

                    <div className="flex-1 relative w-full h-full pt-20 pb-[90px] flex items-center justify-center">
                        <div className="relative w-[90%] max-w-[360px] h-[95%]">
                            {cards.map((data, idx) => {
                                if (idx > 2) return null;
                                const isTop = idx === 0;

                                let cardStyle = {};
                                let imageContainerStyle = {
                                    transform: `translateX(-${data.currentImageIndex * 100}%)`,
                                    transition: isDragging ? 'none' : 'transform 0.3s ease-out'
                                };

                                if (isTop) {
                                    const absX = Math.abs(dragOffset.x);
                                    const absY = Math.abs(dragOffset.y);

                                    if (absY > absX) {
                                        cardStyle = {
                                            transform: `translateY(${dragOffset.y}px)`,
                                            transition: isDragging ? 'none' : 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)'
                                        };
                                    } else {
                                        imageContainerStyle = {
                                            transform: `translateX(calc(-${data.currentImageIndex * 100}% + ${dragOffset.x}px))`,
                                            transition: 'none'
                                        };
                                        cardStyle = {
                                            transform: `translateY(0px)`,
                                            transition: 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)'
                                        };
                                    }
                                } else {
                                    const scale = 1 - (idx * 0.05);
                                    const translateY = idx * 25;
                                    cardStyle = {
                                        transform: `translateY(${translateY}px) scale(${scale})`,
                                        transition: 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)'
                                    };
                                }

                                return (
                                    <div 
                                        key={data.id}
                                        className={`absolute top-0 left-0 w-full h-full rounded-[24px] overflow-hidden ${styles.card} cursor-grab active:cursor-grabbing select-none flex flex-col`}
                                        style={{...cardStyle, zIndex: 10 - idx}}
                                        onMouseDown={isTop ? handleDragStart : null}
                                        onMouseMove={isTop ? handleDragMove : null}
                                        onMouseUp={isTop ? handleDragEnd : null}
                                        onMouseLeave={isTop ? handleDragEnd : null}

                                <div className="flex gap-6 px-2">
                                    <label className="flex items-center gap-3 cursor-pointer">
                                        <input type="radio" name="glassStyle" value="solid" checked={!isGlass} onChange={() => setIsGlass(false)} className="hidden" />
                                        <div className={`w-5 h-5 rounded-full border flex items-center justify-center transition-colors ${!isGlass ? 'border-white' : 'border-gray-500'}`}>
                                            {!isGlass && <div className="w-2.5 h-2.5 rounded-full bg-white"></div>}
                                        </div>
                                        <span className={`text-sm font-bold ${!isGlass ? 'text-white' : 'text-[#A0A0A0]'}`}>ソリッド (不透明)</span>
                                    </label>
                                    <label className="flex items-center gap-3 cursor-pointer">
                                        <input type="radio" name="glassStyle" value="glass" checked={isGlass} onChange={() => setIsGlass(true)} className="hidden" />
                                        <div className={`w-5 h-5 rounded-full border flex items-center justify-center transition-colors ${isGlass ? 'border-white' : 'border-gray-500'}`}>
                                            {isGlass && <div className="w-2.5 h-2.5 rounded-full bg-white"></div>}
                                        </div>
                                        <span className={`text-sm font-bold ${isGlass ? 'text-white' : 'text-[#A0A0A0]'}`}>グラスモーフィズム</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* 📱 アプリ画面エリア */}
                    <div className={`flex-1 flex flex-col w-full max-w-[430px] mx-auto bg-[#050505] shadow-[0_0_50px_rgba(0,0,0,0.8)] relative overflow-hidden h-full`}>
                        
                        {currentAppTab === 'swipe' && (
                            <HomeSwipeScreen theme={theme} styles={styles} />
                        )}
                        {currentAppTab === 'search' && (
                            <SearchTimelineScreen theme={theme} styles={styles} />
                        )}
                        {currentAppTab === 'mypage' && (
                            <MyPageScreen theme={theme} styles={styles} />
                        )}
                        
                        {!['swipe', 'search', 'mypage'].includes(currentAppTab) && (
                            <div className={`relative w-full h-full ${theme.bgMain} flex flex-col transition-colors duration-300`}>
                                <header className={`relative w-full z-20 flex items-center justify-center px-5 py-4 ${styles.glassHeader} pt-safe`}>
                                    <h1 className={`${theme.textMain} app-title text-[16px] font-bold text-center uppercase`}>{currentAppTab}</h1>
                                </header>
                                <div className="flex-1 flex items-center justify-center flex-col gap-4">
                                    <i className={`ph-fill ph-wrench ${theme.textSub} text-4xl opacity-50`}></i>
                                    <p className={`${theme.textSub} font-bold text-sm tracking-widest opacity-80`}>COMING SOON...</p>
                                </div>
                            </div>
                        )}

                        <BottomNav theme={theme} styles={styles} activeTab={currentAppTab} onChangeTab={setCurrentAppTab} />
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
