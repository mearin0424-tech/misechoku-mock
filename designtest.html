                                            <div className={`w-[72px] h-[72px] ${theme.bgMain} ${theme.radiusBase} overflow-hidden relative`}>
                                                <img src={item.imageUrl} alt={item.name} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                                                <div className={`absolute inset-0 border border-black/10 ${theme.radiusBase} pointer-events-none`}></div>
                                            </div>
                                            {item.isExcellent && (
                                                <div className={`flex items-center justify-center gap-1 text-[10px] px-2 py-1 rounded-lg w-[80px] relative -mt-5 z-10 transition-all ${styleData.badge}`}>
                                                    <i className="ph-fill ph-crown text-[12px]"></i>
                                                    <span>優良店</span>
                                                </div>
                                            )}
                                        </div>

                                        <div className="flex-1 min-w-0 flex flex-col pt-1">
                                            <div className="flex items-center justify-between mb-1">
                                                <h3 className={`${theme.textMain} font-bold text-[17px] truncate pr-2 ${theme.hoverAccentText} transition-colors`}>{item.name}</h3>
                                            </div>
                                            <div className="flex items-center flex-wrap text-[11px] mb-2 gap-x-2 gap-y-1.5">
                                                <span className={`${theme.tagText} ${theme.tagBg} border ${theme.tagBorder} px-2 py-0.5 rounded-md font-medium`}>{item.industry}</span>
                                                <span className={`flex items-center ${theme.starColor} font-bold ${theme.starBg} px-1.5 py-0.5 rounded-md`}><i className="ph-fill ph-star text-[12px] mr-0.5"></i>{item.rating}</span>
                                                <span className={`flex items-center ${theme.textSub}`}><i className="ph-fill ph-map-pin text-[11px] mr-0.5"></i>{item.location}</span>
                                            </div>
                                            <div className="mt-1">
                                                <p className={`text-[13px] ${theme.textMain} opacity-80 leading-relaxed line-clamp-2`}>{item.message}</p>
                                            </div>
                                        </div>
                                    </div>
                                    <div className={`flex justify-end items-center mt-3 pt-3 border-t ${theme.border}`}>
                                        <span className={`flex items-center text-[10px] ${theme.textSub} font-medium`}><i className="ph-bold ph-clock text-[11px] mr-1"></i>{item.time}</span>
                                    </div>
                                </div>
                            ))}
                            <div className={`py-8 text-center ${theme.textSub} text-xs font-medium flex items-center justify-center gap-3`}>
                                <div className={`w-10 h-px ${theme.border}`}></div>
                                これ以上結果はありません
                                <div className={`w-10 h-px ${theme.border}`}></div>
                            </div>
                        </div>
                    </div>

                    <button className={`absolute bottom-[90px] right-5 w-[56px] h-[56px] rounded-full flex items-center justify-center transition-all duration-300 hover:scale-105 active:scale-95 z-30 ${styleData.btnPrimary}`}>
                        <i className="ph-bold ph-faders text-[24px]"></i>
                    </button>

                    <BottomNav theme={theme} styleData={styleData} activeTab="search" />
                </div>
            );
        };

        // ==========================================
        // 🚀 アプリケーション全体
        // ==========================================
        const App = () => {
            const [currentThemeId, setCurrentThemeId] = useState('wine_gold'); 
            const [currentMode, setCurrentMode] = useState('dark');
            const [currentStyle, setCurrentStyle] = useState('3d');

            const theme = themes[currentThemeId][currentMode];
            const styleData = theme.styles[currentStyle];

            return (
                <div className={`min-h-screen ${theme.bgApp} transition-colors duration-500 font-sans`}>
                    
                    {/* 🛠️ シミュレーター ツールバー (スマホ対応プルダウン) */}
                    <div className="fixed top-0 left-0 w-full bg-black/80 backdrop-blur-xl border-b border-white/10 p-3 z-[60] shadow-xl">
                        <div className="max-w-4xl mx-auto w-full flex gap-3 items-end overflow-x-auto pb-1 no-scrollbar">
                            <div className="flex-1 min-w-[140px] relative">
                                <label className="block text-[9px] text-gray-400 font-bold tracking-wider mb-1 ml-1">COLOR THEME</label>
                                <select 
                                    className="w-full bg-white/10 text-white border border-white/20 rounded-lg pl-3 pr-8 py-2 text-sm outline-none appearance-none focus:border-white/50 cursor-pointer font-bold"
                                    value={currentThemeId}
                                    onChange={(e) => setCurrentThemeId(e.target.value)}
                                >
                                    {Object.values(themes).map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                </select>
                                <i className="ph-bold ph-caret-down absolute right-3 bottom-3 text-gray-400 pointer-events-none"></i>
                            </div>

                            {/* 新規追加: MODE (Light / Dark) */}
                            <div className="w-[120px] shrink-0 relative">
                                <label className="block text-[9px] text-gray-400 font-bold tracking-wider mb-1 ml-1">MODE</label>
                                <select 
                                    className="w-full bg-white/10 text-[#FFD700] border border-[#FFD700]/50 rounded-lg pl-3 pr-8 py-2 text-sm outline-none appearance-none focus:border-[#FFD700] cursor-pointer font-bold"
                                    value={currentMode}
                                    onChange={(e) => setCurrentMode(e.target.value)}
                                >
                                    <option value="dark">🌙 DARK</option>
                                    <option value="light">☀️ LIGHT</option>
                                </select>
                                <i className="ph-bold ph-caret-down absolute right-3 bottom-3 text-[#FFD700] pointer-events-none"></i>
                            </div>

                            <div className="flex-1 min-w-[140px] relative">
                                <label className="block text-[9px] text-gray-400 font-bold tracking-wider mb-1 ml-1">UI STYLE (質感)</label>
                                <select 
                                    className="w-full bg-white/10 text-white border border-white/20 rounded-lg pl-3 pr-8 py-2 text-sm outline-none appearance-none focus:border-white/50 cursor-pointer font-bold"
                                    value={currentStyle}
                                    onChange={(e) => setCurrentStyle(e.target.value)}
                                >
                                    <option value="gradient">グラデーション (Standard)</option>
                                    <option value="flat">のっぺり (Flat/Minimal)</option>
                                    <option value="3d">立体 (Neumorphism)</option>
                                    <option value="neon">ネオン (Glow/Cyber)</option>
                                </select>
                                <i className="ph-bold ph-caret-down absolute right-3 bottom-3 text-gray-400 pointer-events-none"></i>
                            </div>
                        </div>
                    </div>

                    {/* 📱 プレビューエリア */}
                    <div className="pt-24 pb-16 px-4 flex flex-col xl:flex-row items-center xl:items-start justify-center gap-10 xl:gap-20 min-h-screen">
                        
                        <div className="flex flex-col items-center gap-4 mt-6">
                            <h2 className={`text-sm font-bold tracking-widest ${styleData.textGrad}`}>HOME / SWIPE</h2>
                            <div className={`w-[375px] h-[812px] bg-black relative overflow-hidden shadow-2xl rounded-[40px] border-[6px] border-gray-900 transition-transform duration-500 ring-1 ring-white/10`}>
                                <HomeSwipeScreen theme={theme} styleData={styleData} />
                            </div>
                        </div>

                        <div className="flex flex-col items-center gap-4 mt-6 xl:mt-6">
                            <h2 className={`text-sm font-bold tracking-widest ${styleData.textGrad}`}>SEARCH / TIMELINE</h2>
                            <div className={`w-[375px] h-[812px] bg-black relative overflow-hidden shadow-2xl rounded-[40px] border-[6px] border-gray-900 transition-transform duration-500 ring-1 ring-white/10`}>
                                <SearchTimelineScreen theme={theme} styleData={styleData} />
                            </div>
                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
