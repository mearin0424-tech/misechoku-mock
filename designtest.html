<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NightWork App Design Simulator</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (CDN) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (CDN) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        .pb-safe { padding-bottom: max(16px, env(safe-area-inset-bottom, 16px)); }
        .pt-safe { padding-top: max(8px, env(safe-area-inset-top, 8px)); }
        body { 
            background-color: #000; 
            color: #fff; 
            margin: 0; 
            overflow: hidden;
            height: 100dvh; 
            width: 100vw;
            -webkit-tap-highlight-color: transparent; 
        }
        #root { height: 100%; width: 100%; }

        .font-noto { font-family: 'Noto Sans JP', sans-serif; }
        .font-noto .app-title { font-family: 'Montserrat', 'Noto Sans JP', sans-serif; font-weight: 700; letter-spacing: 0.05em; }

        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        .text-gradient {
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent !important;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // ==========================================
        // 🎨 テーマ定義
        // ==========================================
        const bgThemes = {
            black: { 
                id: 'black', name: 'ブラック', 
                bgApp: 'bg-[#050505]', bgMain: 'bg-[#050505]', textMain: 'text-[#F5F5F5]', textSub: 'text-[#A0A0A0]', 
                borderColor: 'border-[#2A2A2A]', glassBg: 'bg-[#050505]/40', bgMainHex: '#050505'
            }
        };

        const accentColors = {
            amethyst: {
                id: 'amethyst', name: 'アメジスト (王道の紫)',
                accentBg: 'bg-[#8B5CF6]', accentText: 'text-[#A78BFA]',
                btnTextClass: 'text-[#E6DFFC]', btnIconClass: 'text-white',
                accentGrad: 'from-[#A78BFA] to-[#7C3AED]', btnTextGradClass: 'text-[#F4F2FA]', btnIconGradClass: 'text-white'
            },
            lilac: {
                id: 'lilac', name: 'ライラック (淡い紫)',
                accentBg: 'bg-[#D8B4E2]', accentText: 'text-[#D8B4E2]',
                btnTextClass: 'text-[#111]', btnIconClass: 'text-[#111]',
                accentGrad: 'from-[#F3E8F6] to-[#C997D6]', btnTextGradClass: 'text-[#111]', btnIconGradClass: 'text-[#111]'
            },
            light_blue: {
                id: 'light_blue', name: 'ライトブルー (水色)',
                accentBg: 'bg-[#7DD3FC]', accentText: 'text-[#7DD3FC]',
                btnTextClass: 'text-[#111]', btnIconClass: 'text-[#111]',
                accentGrad: 'from-[#BAE6FD] to-[#38BDF8]', btnTextGradClass: 'text-[#111]', btnIconGradClass: 'text-[#111]'
            },
            light_pink: {
                id: 'light_pink', name: 'ライトピンク (薄桃色)',
                accentBg: 'bg-[#F9A8D4]', accentText: 'text-[#F9A8D4]',
                btnTextClass: 'text-[#111]', btnIconClass: 'text-[#111]',
                accentGrad: 'from-[#FBCFE8] to-[#F472B6]', btnTextGradClass: 'text-[#111]', btnIconGradClass: 'text-[#111]'
            }
        };

        const hfColorDefs = {
            black: { id: 'black', name: '単色 (ブラック)', bgClass: 'bg-[#050505]/50' },
            deep_purple: { id: 'deep_purple', name: '単色 (ディープパープル)', bgClass: 'bg-[#9333EA]/30' },
            grad_black_purple: { id: 'grad_black_purple', name: 'グラデ (ブラック × ディープパープル)', bgClass: 'bg-gradient-to-r from-[#050505]/60 to-[#9333EA]/30' },
            grad_purple_yellow: { id: 'grad_purple_yellow', name: 'グラデ (ディープパープル × イエロー)', bgClass: 'bg-gradient-to-r from-[#9333EA]/30 to-[#D4AF37]/30' },
            grad_purple_lilac: { id: 'grad_purple_lilac', name: 'グラデ (ディープパープル × ライラック)', bgClass: 'bg-gradient-to-r from-[#9333EA]/30 to-[#D8B4E2]/30' },
            grad_purple_amethyst: { id: 'grad_purple_amethyst', name: 'グラデ (ディープパープル × アメジスト)', bgClass: 'bg-gradient-to-r from-[#9333EA]/30 to-[#8B5CF6]/30' },
            grad_purple_pink: { id: 'grad_purple_pink', name: 'グラデ (ディープパープル × ピンク)', bgClass: 'bg-gradient-to-r from-[#9333EA]/30 to-[#EC4899]/30' }
        };

        const fontDefs = {
            noto_sans: { id: 'noto_sans', name: 'Noto Sans', family: 'font-noto' }
        };

        const TailwindSafelist = () => (
            <div className="hidden border-[#A855F7]/40 bg-[#A855F7] bg-[#A855F7]/10 bg-[#F5F2FA] bg-[#8B5CF6] text-[#A78BFA] from-[#A78BFA] to-[#7C3AED] bg-[#D8B4E2] text-[#D8B4E2] from-[#F3E8F6] to-[#C997D6] bg-[#7DD3FC] text-[#7DD3FC] from-[#BAE6FD] to-[#38BDF8] bg-[#F9A8D4] text-[#F9A8D4] from-[#FBCFE8] to-[#F472B6] text-[#1A1A1A] text-[#666666] text-[#E6DFFC] text-[#F3E8FF] text-[#E0E7FF] text-[#FAF5FF] text-[#EEF2FF] text-[#111] text-white shadow-[inset_0_4px_6px_rgba(255,255,255,0.5),inset_0_-6px_6px_rgba(0,0,0,0.4),0_12px_24px_rgba(0,0,0,0.7)] active:shadow-[inset_0_6px_8px_rgba(0,0,0,0.6),0_2px_4px_rgba(0,0,0,0.6)] shadow-[8px_8px_20px_rgba(0,0,0,0.8),-2px_-2px_8px_rgba(255,255,255,0.03)] shadow-[inset_0_2px_4px_rgba(0,0,0,0.5)] shadow-[inset_0_2px_4px_rgba(0,0,0,0.1)] bg-[#050505] text-[#F5F5F5] text-[#A0A0A0] border-[#2A2A2A] bg-[#050505]/40 from-[#D4AF37] to-[#B8860B] border-[#D4AF37]/30 bg-[#9333EA] from-[#A855F7] to-[#7E22CE] bg-[#581c87] from-[#6b21a8] to-[#3b0764] bg-[#050505]/50 bg-[#9333EA]/30 from-[#050505]/60 to-[#9333EA]/30 from-[#9333EA]/30 to-[#D4AF37]/30 to-[#D8B4E2]/30 to-[#8B5CF6]/30 to-[#EC4899]/30 shadow-[0_4px_12px_rgba(0,0,0,0.6),inset_0_1px_1px_rgba(255,255,255,0.15),inset_0_-1px_1px_rgba(0,0,0,0.5)] shadow-[0_-4px_20px_rgba(0,0,0,0.7),inset_0_1px_1px_rgba(255,255,255,0.15),inset_0_-1px_1px_rgba(0,0,0,0.5)] bg-gradient-to-br from-[#1a1a1a] to-[#050505] shadow-[6px_6px_16px_rgba(0,0,0,0.9),-2px_-2px_6px_rgba(255,255,255,0.06),inset_1px_1px_1px_rgba(255,255,255,0.08)] whitespace-nowrap pb-32 pb-44"></div>
        );

        // ==========================================
        // 🧩 スタイル生成ロジック
        // ==========================================
        const generateStyles = (t, inputStyle, is3D, isGrad, hfColor) => {
            const shadowBtn3D = 'shadow-[inset_0_4px_6px_rgba(255,255,255,0.5),inset_0_-6px_6px_rgba(0,0,0,0.4),0_12px_24px_rgba(0,0,0,0.7)] active:translate-y-1.5 active:shadow-[inset_0_6px_8px_rgba(0,0,0,0.6),0_2px_4px_rgba(0,0,0,0.6)]';
            const shadowBadge3D = 'shadow-[inset_0_2px_3px_rgba(255,255,255,0.4),inset_0_-3px_3px_rgba(0,0,0,0.4),0_6px_12px_rgba(0,0,0,0.5)]';
            const shadowFab3D = 'shadow-[inset_0_4px_6px_rgba(255,255,255,0.5),inset_0_-6px_6px_rgba(0,0,0,0.4),0_14px_28px_rgba(0,0,0,0.7)] active:translate-y-1.5 active:shadow-[inset_0_6px_8px_rgba(0,0,0,0.6),0_2px_4px_rgba(0,0,0,0.6)]';

            const fixedBorderColor = 'border-[#A855F7]/40';
            const cardBg = is3D ? 'bg-gradient-to-br from-[#1a1a1a] to-[#050505]' : 'bg-transparent';
            const shadowCard3D = is3D ? 'shadow-[6px_6px_16px_rgba(0,0,0,0.9),-2px_-2px_6px_rgba(255,255,255,0.06),inset_1px_1px_1px_rgba(255,255,255,0.08)]' : 'shadow-none';

            const headerShadow = 'shadow-[0_4px_12px_rgba(0,0,0,0.6),inset_0_1px_1px_rgba(255,255,255,0.15),inset_0_-1px_1px_rgba(0,0,0,0.5)]';
            const footerShadow = 'shadow-[0_-4px_20px_rgba(0,0,0,0.7),inset_0_1px_1px_rgba(255,255,255,0.15),inset_0_-1px_1px_rgba(0,0,0,0.5)]';

            const glassHeaderStyle = `${hfColor.bgClass} backdrop-blur-md border-b ${fixedBorderColor} ${headerShadow}`;
            const glassFooterStyle = `${hfColor.bgClass} backdrop-blur-md border-t ${fixedBorderColor} ${footerShadow}`;

            const inputBgClass = inputStyle === 'light' ? 'bg-[#F5F2FA]' : 'bg-[#A855F7]/10';
            const inputBorderClass = inputStyle === 'light' ? 'border-transparent' : `border ${fixedBorderColor}`;
            const inputTextClass = inputStyle === 'light' ? 'text-[#1A1A1A]' : 'text-[#F5F5F5]';
            const inputSubTextClass = inputStyle === 'light' ? 'text-[#666666]' : 'text-[#A0A0A0]';
            const inputPlaceholderClass = inputStyle === 'light' ? 'placeholder-gray-500' : 'placeholder-gray-400';
            const inputShadowClass = inputStyle === 'light' ? 'shadow-[inset_0_2px_4px_rgba(0,0,0,0.1)]' : 'shadow-[inset_0_2px_4px_rgba(0,0,0,0.5)]';

            const btnBgClass = isGrad ? 'bg-gradient-to-r from-[#6b21a8] to-[#3b0764]' : 'bg-[#581c87]';
            const btnTextClass = isGrad ? 'text-[#FAF5FF]' : 'text-[#F3E8FF]';
            const btnIconClass = 'text-white';

            return {
                button: `px-6 py-3.5 rounded-full ${btnBgClass} ${btnTextClass} ${is3D ? shadowBtn3D : 'shadow-md'} border border-transparent transition-all duration-300 flex items-center justify-center gap-2 font-bold`,
                buttonIcon: btnIconClass,
                badge: `px-4 py-2 rounded-full ${btnBgClass} ${btnTextClass} ${is3D ? shadowBadge3D : ''} font-bold text-sm`,
                miniBadge: `flex items-center justify-center gap-1 ${btnBgClass} ${btnTextClass} text-[9px] font-bold px-1.5 py-0.5 rounded w-full relative -mt-4 z-10 ${is3D ? shadowBadge3D : 'border border-black/20'}`,
                fab: `absolute bottom-[90px] right-5 w-[56px] h-[56px] rounded-full flex items-center justify-center ${btnBgClass} ${btnTextClass} hover:scale-105 transition-all z-30 ${is3D ? shadowFab3D : 'shadow-lg active:scale-95'}`,
                
                textAccent: t.accentText,
                iconAccent: t.accentText,
                fixedBorderColor: fixedBorderColor,
                
                card: `${cardBg} rounded-[20px] overflow-hidden transition-all duration-300 ${shadowCard3D} border ${fixedBorderColor}`,
                menuCard: `${cardBg} p-4 flex items-center justify-between rounded-[16px] transition-all duration-300 group cursor-pointer ${shadowCard3D} border ${fixedBorderColor}`,
                
                specialMenuCard: `rounded-[16px] p-4 flex items-center justify-between transition-all duration-300 group cursor-pointer ${is3D ? `${btnBgClass} ${shadowBtn3D} border border-transparent` : `${cardBg} ${shadowCard3D} border ${fixedBorderColor}`}`,
                specialMenuTitle: `app-title font-bold text-[15px] tracking-widest group-hover:opacity-80 transition-opacity ${is3D ? btnTextClass : t.accentText}`,
                specialMenuSub: `text-[9px] font-bold tracking-[0.1em] mb-1 uppercase ${is3D ? btnTextClass + ' opacity-70' : t.textSub}`,
                specialMenuIconWrapper: `w-11 h-11 rounded-xl flex items-center justify-center transition-all ${is3D ? 'bg-black/20 shadow-inner border border-white/10' : 'bg-transparent border ' + fixedBorderColor + ' shadow-[inset_0_2px_4px_rgba(0,0,0,0.6)]'}`,
                specialMenuIcon: `text-[18px] ${is3D ? btnIconClass : t.accentText}`,
                specialMenuArrow: `w-8 h-8 rounded-full border flex items-center justify-center transition-colors ${is3D ? 'border-white/30 group-hover:border-white/70' : 'border-white/20 group-hover:border-white/50'}`,
                specialMenuArrowIcon: `text-[16px] transition-colors ${is3D ? btnIconClass + ' opacity-70 group-hover:opacity-100' : 'text-white/50 group-hover:text-white'}`,

                inputContainer: `${inputBgClass} ${inputBorderClass} ${inputShadowClass} transition-all duration-300`,
                inputText: inputTextClass,
                inputSubText: inputSubTextClass,
                inputPlaceholder: inputPlaceholderClass,

                glassHeader: glassHeaderStyle,
                glassFooter: glassFooterStyle,
                tabLine: `absolute bottom-0 left-1/2 -translate-x-1/2 w-12 h-1 rounded-t-full bg-[#A855F7]`,
                
                myMessageBubble: `px-4 py-2.5 rounded-[20px] rounded-tr-sm ${btnBgClass} ${btnTextClass} ${is3D ? shadowBadge3D : 'shadow-md'} font-medium text-[13px] leading-relaxed border border-transparent w-fit`,
                otherMessageBubble: `px-4 py-2.5 rounded-[20px] rounded-tl-sm ${cardBg} border ${fixedBorderColor} ${shadowCard3D} ${t.textMain} font-medium text-[13px] leading-relaxed w-fit`,
                systemMessageBubble: `px-4 py-2.5 rounded-[20px] ${cardBg} border ${fixedBorderColor} ${shadowCard3D} ${t.textMain} font-medium text-[13px] leading-relaxed w-fit`
            }
        };

        // ==========================================
        // 📱 共通コンポーネント: 下部ナビゲーション
        // ==========================================
        const BottomNav = ({ theme, styles, activeTab, onChangeTab }) => {
            const navItems = [
                { id: 'swipe', icon: 'ph-fill ph-house', label: 'SWIPE' },
                { id: 'search', icon: 'ph-bold ph-magnifying-glass', label: 'SEARCH' },
                { id: 'likes', icon: 'ph-fill ph-heart', label: 'LIKES' },
                { id: 'talk', icon: 'ph-fill ph-chat-teardrop-text', label: 'TALK' },
                { id: 'mypage', icon: 'ph-fill ph-user', label: 'MY PAGE' },
            ];

            return (
                <nav className={`absolute bottom-0 left-0 w-full ${styles.glassFooter} z-50 pb-safe transition-colors duration-300`}>
                    <div className="flex justify-around items-center pt-3 pb-2 px-2 max-w-[430px] mx-auto">
                        {navItems.map(item => {
                            const isActive = activeTab === item.id || (item.id === 'talk' && activeTab === 'talk_room');
                            return (
                                <button key={item.id} onClick={() => onChangeTab(item.id)} className={`flex flex-col items-center p-2 transition-all duration-300 group ${isActive ? styles.textAccent : theme.textSub}`}>
                                    <i className={`${item.icon} text-[22px] mb-1.5 transition-transform ${isActive ? 'scale-110' : 'group-hover:scale-95 group-hover:text-white'}`}></i>
                                    <span className={`app-title text-[9px] font-bold tracking-wider ${isActive ? '' : 'group-hover:text-white'}`}>{item.label}</span>
                                </button>
                            );
                        })}
                    </div>
                </nav>
            );
        };

        // ==========================================
        // 📱 画面1: ホーム / スワイプ画面 (フルスクリーン & 無限ループ)
        // ==========================================
        const HomeSwipeScreen = ({ theme, styles, is3D, isGrad, swipeActionStyle, onOpenTalk }) => {
            const initialCards = [
                { id: '1', name: 'Club Luminous', copy: 'エリア最高峰の高級ラウンジ', rating: '4.8', reviews: '24', location: '東京都 港区', bonus: '￥120,000', hourlyWage: '￥2,500 ~ ￥5,000', helpWage: '￥2,500 ~ ￥5,000', imageUrls: ['https://images.unsplash.com/photo-1585553616435-2dc0a54e271d?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80', 'https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80'] },
                { id: '2', name: 'Snack 昭和', copy: 'アットホームな老舗スナック', rating: '4.2', reviews: '8', location: '東京都 葛飾区', bonus: '￥120,000', hourlyWage: '￥2,500 ~ ￥5,000', helpWage: '￥2,500 ~ ￥5,000', imageUrls: ['https://images.unsplash.com/photo-1514933651103-005eec06c04b?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80'] },
                { id: '3', name: 'CUTE', copy: '未経験から高収入を目指せる！', rating: '4.5', reviews: '12', location: '東京都 江戸川区', bonus: '￥120,000', hourlyWage: '￥2,500 ~ ￥5,000', helpWage: '￥2,500 ~ ￥5,000', imageUrls: ['https://images.unsplash.com/photo-1513360371669-4adf3dd7dff8?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80'] }
            ];

            const [cards, setCards] = useState(initialCards.map(c => ({...c, currentImageIndex: 0})));
            const [dragStart, setDragStart] = useState({ x: 0, y: 0 });
            const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });
            const [isDragging, setIsDragging] = useState(false);

            const handleDragStart = (e) => {
                const pos = e.type.includes('mouse') ? e : e.touches[0];
                setDragStart({ x: pos.clientX, y: pos.clientY });
                setIsDragging(true);
            };

            const handleDragMove = (e) => {
                if (!isDragging) return;
                const pos = e.type.includes('mouse') ? e : e.touches[0];
                setDragOffset({ x: pos.clientX - dragStart.x, y: pos.clientY - dragStart.y });
            };

            const handleDragEnd = () => {
                if (!isDragging) return;
                setIsDragging(false);
                const { x, y } = dragOffset;
                const threshold = 60;
                if (Math.abs(y) > Math.abs(x) && Math.abs(y) > threshold) {
                    handleSwipeCard(y < 0 ? 'up' : 'down');
                } else if (Math.abs(x) > Math.abs(y) && Math.abs(x) > threshold) {
                    handleSwipeImage(x < 0 ? 'next' : 'prev');
                } else {
                    setDragOffset({ x: 0, y: 0 });
                }
            };

            const handleSwipeCard = (direction) => {
                setDragOffset({ x: 0, y: direction === 'up' ? -window.innerHeight : window.innerHeight });
                setTimeout(() => {
                    setCards(prev => {
                        const newCards = [...prev];
                        const item = direction === 'up' ? newCards.shift() : newCards.pop();
                        direction === 'up' ? newCards.push(item) : newCards.unshift(item);
                        return newCards.map(c => ({...c, currentImageIndex: 0}));
                    });
                    setDragOffset({ x: 0, y: 0 });
                }, 300);
            };

            const handleSwipeImage = (direction) => {
                setCards(prev => {
                    const newCards = [...prev];
                    const top = newCards[0];
                    const max = top.imageUrls.length - 1;
                    if (direction === 'next' && top.currentImageIndex < max) top.currentImageIndex++;
                    else if (direction === 'prev' && top.currentImageIndex > 0) top.currentImageIndex--;
                    return newCards;
                });
                setDragOffset({ x: 0, y: 0 });
            };

            const sideBtnWrapperStyle = "flex flex-col items-center gap-1.5 cursor-pointer pointer-events-auto transition-transform active:scale-90";
            const sideBtnGlassStyle = "w-14 h-14 rounded-full bg-white/10 backdrop-blur-md border border-white/20 flex items-center justify-center shadow-[0_4px_12px_rgba(0,0,0,0.5)]";
            const sideBtnLabelStyle = "text-white text-[10px] font-bold tracking-wider drop-shadow-md whitespace-nowrap";
            const iconGradStyle = `text-[24px] text-gradient bg-gradient-to-r ${theme.accentGrad}`;
            const bonusBadgeStyle = `inline-flex items-center gap-4 mb-3 transform hover:scale-105 transition-all self-start px-4 py-2.5 rounded-full text-[#111] font-bold bg-gradient-to-r from-[#D4AF37] to-[#B8860B] shadow-[inset_0_4px_6px_rgba(255,255,255,0.4),inset_0_-6px_6px_rgba(0,0,0,0.4),0_12px_24px_rgba(0,0,0,0.7)] border border-[#D4AF37]/30`;

            return (
                <div className={`relative w-full h-full flex flex-col overflow-hidden transition-colors duration-300 ${theme.bgMain}`}
                     onMouseDown={handleDragStart} onMouseMove={handleDragMove} onMouseUp={handleDragEnd} onMouseLeave={handleDragEnd}
                     onTouchStart={handleDragStart} onTouchMove={handleDragMove} onTouchEnd={handleDragEnd}>
                    
                    <header className={`absolute top-0 left-0 w-full z-40 flex items-center justify-between px-5 py-4 ${styles.glassHeader} pt-safe transition-colors duration-300 pointer-events-none`}>
                        <div className="w-12"></div>
                        <h1 className={`${theme.textMain} app-title text-[16px] font-bold text-center absolute left-1/2 -translate-x-1/2 uppercase`}>Discovery</h1>
                        <div className={`flex items-center gap-4 ${styles.iconAccent} pointer-events-auto`}>
                            <i className="ph-bold ph-bell text-[20px] relative"><span className="absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full border-2 border-black bg-[#A855F7]"></span></i>
                        </div>
                    </header>

                    <div className="flex-1 relative w-full h-full">
                        {cards.slice(0, 2).map((data, idx) => {
                            const isTop = idx === 0;
                            let cardStyle = { width: '100%', height: '100%', position: 'absolute', top: 0, left: 0 };

            const [isMenuOpen, setIsMenuOpen] = useState(false);

            const theme = { ...bgThemes.black, ...accentColors[currentAccentId], bgMainHex: '#050505' };
            const styles = generateStyles(theme, inputStyle, is3D, isGrad, hfColorDefs[hfColorId]);

            return (
                <div className={`h-[100dvh] w-full flex flex-col ${theme.bgApp} transition-colors duration-500 font-noto`}>
                    <TailwindSafelist />
                    <button onClick={() => setIsMenuOpen(true)} className="fixed top-4 right-4 z-[60] bg-black/60 backdrop-blur-md border border-white/20 px-4 py-3 rounded-full shadow-2xl flex items-center gap-2 hover:scale-105 transition-all"><i className="ph-fill ph-palette text-[20px] text-white"></i><span className="text-white text-[10px] font-bold tracking-widest uppercase">Design</span></button>
                    {isMenuOpen && <div className="fixed inset-0 bg-black/50 z-[70]" onClick={() => setIsMenuOpen(false)}></div>}
                    <div className={`fixed top-0 right-0 h-full w-[300px] bg-[#0A0A0A]/95 backdrop-blur-xl border-l border-white/10 z-[80] transform transition-transform duration-300 ${isMenuOpen ? 'translate-x-0' : 'translate-x-full'} p-6 overflow-y-auto`}>
                        <div className="flex justify-between mb-8 pb-4 border-b border-white/10 text-white font-bold tracking-widest text-sm flex items-center gap-2"><i className="ph-fill ph-faders text-white"></i>CONTROLLER<i onClick={() => setIsMenuOpen(false)} className="ph-bold ph-x text-gray-400 cursor-pointer ml-auto"></i></div>
                        <div className="flex flex-col gap-6 text-white text-[10px] font-bold tracking-wider">
                            <label className="mb-[-15px] uppercase">Header & Footer Color</label>
                            <select className="bg-[#1A1A1A] border border-white/20 rounded-lg p-3 outline-none" value={hfColorId} onChange={e => setHfColorId(e.target.value)}>{Object.values(hfColorDefs).map(t => <option key={t.id} value={t.id}>{t.name}</option>)}</select>
                            <label className="mb-[-15px] uppercase">Text & Icon Color</label>
                            <select className="bg-[#1A1A1A] border border-white/20 rounded-lg p-3 outline-none" value={currentAccentId} onChange={e => setCurrentAccentId(e.target.value)}>{Object.values(accentColors).map(t => <option key={t.id} value={t.id}>{t.name}</option>)}</select>
                            <div className="border-t border-white/10 pt-4 flex flex-col gap-4">
                                <label className="flex items-center gap-3 cursor-pointer"><input type="checkbox" checked={is3D} onChange={e => setIs3D(e.target.checked)} className="hidden" /><div className={`w-5 h-5 border rounded flex items-center justify-center ${is3D ? 'bg-white' : ''}`}>{is3D && <i className="ph-bold ph-check text-black"></i>}</div>思いっきり立体</label>
                                <label className="flex items-center gap-3 cursor-pointer"><input type="checkbox" checked={isGrad} onChange={e => setIsGrad(e.target.checked)} className="hidden" /><div className={`w-5 h-5 border rounded flex items-center justify-center ${isGrad ? 'bg-white' : ''}`}>{isGrad && <i className="ph-bold ph-check text-black"></i>}</div>グラデーション背景</label>
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col w-full max-w-[430px] mx-auto bg-[#050505] shadow-[0_0_50px_rgba(0,0,0,0.8)] relative overflow-hidden h-full">
                        {currentAppTab === 'swipe' && <HomeSwipeScreen theme={theme} styles={styles} is3D={is3D} isGrad={isGrad} swipeActionStyle={swipeActionStyle} onOpenTalk={() => setCurrentAppTab('talk_room')} />}
                        {currentAppTab === 'search' && <SearchTimelineScreen theme={theme} styles={styles} />}
                        {currentAppTab === 'likes' && <LikesScreen theme={theme} styles={styles} />}
                        {currentAppTab === 'talk' && <TalkListScreen theme={theme} styles={styles} onOpenRoom={() => setCurrentAppTab('talk_room')} />}
                        {currentAppTab === 'talk_room' && <TalkRoomScreen theme={theme} styles={styles} is3D={is3D} isGrad={isGrad} onBack={() => setCurrentAppTab('talk')} />}
                        {currentAppTab === 'mypage' && <MyPageScreen theme={theme} styles={styles} />}
                        <BottomNav theme={theme} styles={styles} activeTab={currentAppTab} onChangeTab={setCurrentAppTab} />
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
