            const theme = themes[currentThemeId][currentMode];
            const styleData = theme.styles[currentStyle];

                                    <label className="block text-[10px] text-gray-400 font-bold tracking-wider mb-1.5 ml-1">UI STYLE (質感)</label>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
